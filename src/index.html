<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantage Rush</title>
<link rel="icon" href="data:,">
<style>
:root{--navy:#061a3d;--blue:#0a63d6;--sky:#2fa8ff;--ice:#e8f3ff;--white:#fff;--gold:#ffd24a}
*{box-sizing:border-box;margin:0;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:var(--navy);color:var(--white);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;cursor:default}
#app{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0,#0f4ab0 0,var(--navy) 70%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;padding:3vmin}
h1{font-size:9vmin;letter-spacing:.25vmin;font-weight:900;text-transform:uppercase;line-height:1}
h1 b{color:var(--sky)}
.sub{font-size:2.6vmin;color:var(--ice);opacity:.9}
.cta{font-size:4.6vmin;font-weight:900;color:var(--navy);background:var(--white);padding:1.6vmin 5vmin;border-radius:10vmin;animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 0 .8vmin rgba(47,168,255,.45)}
@keyframes pulse{50%{transform:scale(1.07)}}
.row{display:flex;gap:4vmin;align-items:center;justify-content:center}
.cards{display:flex;gap:3vmin}
.cards canvas{height:30vmin;border:.8vmin solid var(--white);border-radius:.8vmin;box-shadow:0 1vmin 3vmin #0008;transform:rotate(var(--r));transition:opacity .6s}
.board{background:#ffffff14;border:.3vmin solid #ffffff40;border-radius:1.6vmin;padding:2vmin 3.5vmin;min-width:34vmin}
.board h2{font-size:3vmin;text-align:center;margin-bottom:1vmin;color:var(--sky);letter-spacing:.3vmin}
.board ol{list-style:none;font-size:2.7vmin;font-variant-numeric:tabular-nums}
.board li{display:flex;gap:2vmin;padding:.35vmin 1vmin;border-radius:.8vmin}
.board li i{font-style:normal;width:4vmin;opacity:.6}.board li span{flex:1;font-weight:800;letter-spacing:.4vmin}
.board li.me{background:var(--white);color:var(--navy)}
.board .none{opacity:.6;text-align:center;font-size:2.4vmin;padding:1vmin}
.hud{position:absolute;top:0;left:0;right:0;height:9vmin;display:flex;align-items:center;justify-content:space-between;padding:0 3vmin;font-size:3.2vmin;font-weight:800}
.hud .q{font-size:2.6vmin;font-weight:600;color:var(--ice)}
.bar{position:absolute;top:9vmin;left:0;right:0;height:1.2vmin;background:#ffffff22}
.bar>div{height:100%;background:var(--sky);width:100%;transform-origin:left}
.bar.low>div{background:var(--gold)}
.play{position:absolute;top:11.5vmin;bottom:2vmin;left:0;right:0;display:flex;gap:3vmin;justify-content:center;align-items:center}
.play canvas{height:100%;max-width:46vw;border-radius:1vmin;background:#0004}
#pc{border:.8vmin solid var(--white);border-radius:.8vmin!important;aspect-ratio:4/5;height:min(100%,calc(46vw*1.25))!important;width:auto}
#map{aspect-ratio:1;cursor:crosshair;border:.5vmin solid var(--sky)}
.cap{position:absolute;bottom:.4vmin;font-size:2vmin;color:var(--ice);opacity:.85}
.pop{position:absolute;left:25%;top:2vmin;transform:translateX(-50%);max-width:44%;text-align:center;background:#061a3de8;border:.4vmin solid var(--sky);border-radius:2vmin;padding:1vmin 3vmin;pointer-events:none}
.pop .big{font-size:6vmin;font-weight:900;line-height:1.1}.pop .sm{font-size:2.4vmin;color:var(--ice)}
.mute{position:fixed;left:1.5vmin;bottom:1.5vmin;z-index:5;font:inherit;font-size:2vmin;font-weight:800;color:var(--ice);background:#061a3dcc;border:.3vmin solid #ffffff66;border-radius:10vmin;padding:.6vmin 2vmin;cursor:pointer}
.btn{font:inherit;font-size:3.2vmin;font-weight:900;color:var(--navy);background:var(--white);border:0;border-radius:10vmin;padding:1.2vmin 4vmin;cursor:pointer}
.btn:hover{background:var(--sky);color:var(--white)}.btn.ghost{background:transparent;color:var(--ice);border:.3vmin solid #ffffff66}
.next{position:absolute;right:3vmin;bottom:3vmin}
.total{font-size:14vmin;font-weight:900;line-height:1}
.total small{font-size:3vmin;display:block;text-align:center;color:var(--sky);letter-spacing:.4vmin}
.init{display:flex;gap:2vmin}.slot{display:flex;flex-direction:column;align-items:center;gap:.6vmin;padding:.8vmin;border-radius:1.4vmin;border:.4vmin solid transparent}
.slot.on{border-color:var(--sky);background:#ffffff18}
.slot .ch{font-size:9vmin;font-weight:900;width:9vmin;text-align:center;line-height:1}
.slot button{font:inherit;font-size:3vmin;color:var(--white);background:var(--blue);border:0;border-radius:1vmin;width:9vmin;height:4.6vmin;cursor:pointer}
.slot button:hover{background:var(--sky)}
.idle{font-size:2.2vmin;color:var(--ice);opacity:.8}
.rounds{display:flex;gap:3vmin;font-size:2.6vmin}.rounds b{color:var(--sky)}
#err{font-size:3vmin;padding:6vmin;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<!--BUNDLE-->
</body>
</html>
